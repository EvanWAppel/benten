<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#14161a" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Benten — a dark stage console for a musical life. Big glanceable chords, a bright fretboard, and a place to catch a take — built to read across the room mid-jam." />
  <title>benten — a musical workbench</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to workspace</a>
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">b.</span>
      <span class="brand-name">benten<span class="brand-dot">.</span></span>
    </div>
    <nav class="modules" aria-label="modules">
      <button class="module is-active" data-module="chords" aria-current="page"><span class="nav-number">01</span><span>Chords</span></button>
      <button class="module" data-module="studio" title="record &amp; overdub"><span class="nav-number">02</span><span>Studio</span></button>
      <button class="module" data-module="tabs" title="find &amp; file tablature"><span class="nav-number">03</span><span>Tabs</span></button>
      <button class="module" data-module="effects" title="build an effect chain"><span class="nav-number">04</span><span>Effects</span></button>
    </nav>
    <div class="appbar-status" aria-label="workspace">
      <span class="live-dot" aria-hidden="true"></span>
      <span id="workspace-name">HARMONY</span>
    </div>
  </header>
  <div class="app-shell">
    <main id="view" tabindex="-1"></main>
    <footer class="statusbar"><span id="status" role="status">ready</span><span class="statusbar-motto">Everything starts with an idea.</span></footer>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
