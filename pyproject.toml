[project]
name = "benten"
version = "0.1.0"
description = "A local web app for musical practice — chord/scale helper first, then studio, tabs, effects. Sits on top of the Markdown drawers. See PRD.md."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
benten = "benten.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benten"]

[tool.pytest.ini_options]
testpaths = ["tests"]
